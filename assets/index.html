<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Dad Jokes">
        <meta name="keywords" content="HTML,CSS,JavaScript, Quotes, API">
        <meta name="author" content="rushyrush">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dad Jokes</title>

        <link rel="preconnect" href="https://cdnjs.cloudflare.com">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    </head>
    <body>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="card-deck" id="cardDeck">
            <div class="card" id="cardA">
                <div class="quote-wrapper">
                    <i class="fa-solid fa-quote-left quote-icon"></i>
                    <span class="quote" id="quoteA"></span>
                    <i class="fa-solid fa-quote-right quote-icon"></i>
                </div>
                <hr/>
                <div class="buttons">
                    <button class="next" onclick="flipCard()">
                        <i class="fa-solid fa-shuffle"></i> More
                    </button>
                    <button class="copy" onclick="copyQuote()">
                        <i class="fa-regular fa-clipboard"></i> Copy
                    </button>
                </div>
            </div>

            <div class="card" id="cardB">
                <div class="quote-wrapper">
                    <i class="fa-solid fa-quote-left quote-icon"></i>
                    <span class="quote" id="quoteB"></span>
                    <i class="fa-solid fa-quote-right quote-icon"></i>
                </div>
                <hr/>
                <div class="buttons">
                    <button class="next" onclick="flipCard()">
                        <i class="fa-solid fa-shuffle"></i> More
                    </button>
                    <button class="copy" onclick="copyQuote()">
                        <i class="fa-regular fa-clipboard"></i> Copy
                    </button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast">Copied!</div>
        <script src="script.js"></script>
    </body>
</html>
